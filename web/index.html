<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trackify - VGM Web Player</title>
<link href="app.css" rel="stylesheet" type="text/css" />

<!-- Generic player first (defines ScriptNodePlayer + the Ems* adapter base classes),
     then the two backends (define backend_PSX/backend_SNES + their adapter subclasses),
     finally the UI. -->
<script src="scriptprocessor_player.js"></script>
<script src="backend_psx.js"></script>
<script src="backend_snes.js"></script>
</head>

<body>
<main>
    <h1>Trackify</h1>
    <p class="subtitle">VGM web player &mdash; PSX/PSF &amp; SNES/SPC</p>

    <ul id="trackList" class="track-list"></ul>

    <div class="controls">
        <button id="prevBtn" title="Previous">&#9198;</button>
        <button id="playBtn" title="Play / Pause">&#9654;</button>
        <button id="nextBtn" title="Next">&#9197;</button>
    </div>

    <div id="status" class="status">Loading backends&hellip;</div>

    <dl id="songInfo" class="song-info"></dl>
</main>

<script src="app.js"></script>
</body>
</html>
