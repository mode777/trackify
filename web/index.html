<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trackify - VGM Web Player</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&family=Inter:wght@400;500&family=Montserrat:wght@600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />

</head>

<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand-block">
            <h1>Trackify</h1>
            <p>Cyber-Orchestra Edition</p>
        </div>

        <nav class="sidebar-nav" aria-label="Main navigation">
            <a class="active" href="/games.html" target="content-frame"><span class="material-symbols-outlined">sports_esports</span>Games</a>
            <a href="#"><span class="material-symbols-outlined">layers</span>Platforms</a>
            <a href="#"><span class="material-symbols-outlined">person</span>Artists</a>
            <a href="#"><span class="material-symbols-outlined">library_music</span>Your Library</a>
        </nav>

        <button class="create-btn" type="button">
            <span class="material-symbols-outlined">add</span>
            Create Playlist
        </button>

        <nav class="sidebar-footer" aria-label="Secondary navigation">
            <a href="#" target=""><span class="material-symbols-outlined">settings</span>Settings</a>
            <a href="#"><span class="material-symbols-outlined">download</span>Downloads</a>
        </nav>
    </aside>

    <div class="main-shell">
        <header class="top-bar">
            <div class="top-left">
                <div class="history-buttons" aria-hidden="true">
                    <button type="button"><span class="material-symbols-outlined">chevron_left</span></button>
                    <button type="button" disabled><span class="material-symbols-outlined">chevron_right</span></button>
                </div>
                <label class="search-wrap" aria-label="Search for tracks">
                    <span class="material-symbols-outlined">search</span>
                    <input type="text" placeholder="Search for tracks..." />
                </label>
            </div>
            <div class="top-right">
                <button class="ghost-icon" type="button"><span class="material-symbols-outlined">notifications</span></button>
                <div class="avatar" aria-hidden="true">T</div>
            </div>
        </header>

        <main class="content-area">
            <iframe id="playlistFrame" class="content-frame" name="content-frame" title="Content Frame" src="/games.html" loading="eager"></iframe>
        </main>
    </div>

    <footer class="player-host">
        <iframe id="playerFrame" title="Trackify Player" src="/player.html" loading="eager"></iframe>
    </footer>
</div>

<script type="module" src="/main.js"></script>
</body>
</html>
