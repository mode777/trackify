<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trackify - VGM Web Player</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&family=Inter:wght@400;500&family=Montserrat:wght@600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />

</head>

<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand-block">
            <h1>Trackify</h1>
            <p>Cyber-Orchestra Edition</p>
        </div>

        <nav class="sidebar-nav" aria-label="Main navigation">
            <a class="active" href="#"><span class="material-symbols-outlined">home</span>Home</a>
            <a href="#"><span class="material-symbols-outlined">layers</span>Platforms</a>
            <a href="#"><span class="material-symbols-outlined">person</span>Composers</a>
            <a href="#"><span class="material-symbols-outlined">library_music</span>Your Library</a>
        </nav>

        <button class="create-btn" type="button">
            <span class="material-symbols-outlined">add</span>
            Create Playlist
        </button>

        <nav class="sidebar-footer" aria-label="Secondary navigation">
            <a href="#"><span class="material-symbols-outlined">settings</span>Settings</a>
            <a href="#"><span class="material-symbols-outlined">download</span>Downloads</a>
        </nav>
    </aside>

    <main class="content-area">
        <header class="top-bar">
            <div class="top-left">
                <div class="history-buttons" aria-hidden="true">
                    <button type="button"><span class="material-symbols-outlined">chevron_left</span></button>
                    <button type="button" disabled><span class="material-symbols-outlined">chevron_right</span></button>
                </div>
                <label class="search-wrap" aria-label="Search for tracks">
                    <span class="material-symbols-outlined">search</span>
                    <input type="text" placeholder="Search for tracks..." />
                </label>
            </div>
            <div class="top-right">
                <button class="ghost-icon" type="button"><span class="material-symbols-outlined">notifications</span></button>
                <div class="avatar" aria-hidden="true">T</div>
            </div>
        </header>

        <section class="hero">
            <div class="hero-art" aria-hidden="true">
                <div class="hero-play"><span class="material-symbols-outlined">play_circle</span></div>
            </div>
            <div class="hero-text">
                <p class="eyebrow">Album</p>
                <h2>The Legend of Zelda: Ocarina of Time</h2>
                <p class="meta">Nintendo <span class="dot"></span> 1998 <span class="dot"></span> Sample Playlist</p>
            </div>
        </section>

        <section class="action-bar" aria-label="Album actions">
            <button class="primary-action" type="button"><span class="material-symbols-outlined">play_arrow</span></button>
            <button class="ghost-icon" type="button"><span class="material-symbols-outlined">favorite</span></button>
            <button class="ghost-icon" type="button"><span class="material-symbols-outlined">add_circle</span></button>
            <button class="ghost-icon" type="button"><span class="material-symbols-outlined">more_horiz</span></button>
            <p id="status" class="shell-status">Waiting for player...</p>
        </section>

        <section class="playlist" aria-label="Track list">
            <div class="playlist-header">
                <span>#</span>
                <span>Title</span>
                <span>Type</span>
            </div>
            <ul id="trackList" class="track-list playlist-list"></ul>
        </section>
    </main>

    <footer class="player-host">
        <iframe id="playerFrame" title="Trackify Player" src="/player.html" loading="eager"></iframe>
    </footer>
</div>

<script type="module" src="/main.js"></script>
</body>
</html>
