<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trackify - VGM Web Player</title>

<!-- Generic player first (defines ScriptNodePlayer + the Ems* adapter base classes),
     then the backends (define backend_* modules + adapter subclasses),
     finally the UI. -->
<script>
    // Generated backend wrappers read this prefix in locateFile(path).
    // Keep it relative so both root and sub-path hosting work.
    window.WASM_SEARCH_PATH = 'wasm/';
</script>
<script src="/wasm/scriptprocessor_player.js"></script>
</head>

<body>
<main>
    <h1>Trackify</h1>
    <p class="subtitle">VGM web player &mdash; PSX/PSF, SNES/SPC, NEZ (BGM/OPX/NSF/SNG/KSS) &amp; N64 (USF/miniUSF)</p>

    <ul id="trackList" class="track-list"></ul>

    <div class="controls">
        <button id="prevBtn" title="Previous">&#9198;</button>
        <button id="playBtn" title="Play / Pause">&#9654;</button>
        <button id="nextBtn" title="Next">&#9197;</button>
    </div>

    <div class="seek" id="seekWrap">
        <span id="timeCurrent" class="time">0:00</span>
        <input id="seekBar" type="range" min="0" max="100" value="0" step="100" disabled />
        <span id="timeTotal" class="time">0:00</span>
    </div>

    <div id="status" class="status">Loading player&hellip;</div>

    <dl id="songInfo" class="song-info"></dl>
</main>

<script type="module" src="/main.js"></script>
</body>
</html>
