<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trackify Playlist</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&family=Inter:wght@400;500&family=Montserrat:wght@600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/app.css" />
<link rel="stylesheet" href="/playlist.css" />
</head>

<body class="playlist-page">
<main class="playlist-root">
    <section class="hero">
        <button class="hero-art" type="button" aria-label="Play selected list">
            <span class="hero-playlist-icon material-symbols-outlined" aria-hidden="true"></span>
            <span class="hero-favorite-icon material-symbols-outlined filled" aria-hidden="true">favorite</span>
            <div class="hero-play" aria-hidden="true"><span class="material-symbols-outlined filled">play_circle</span></div>
        </button>
        <div class="hero-text">
            <p id="heroEyebrow" class="eyebrow">Game</p>
            <div class="hero-title-row">
                <h2 id="heroTitle">Title</h2>
                <button id="heroEditButton" class="hero-edit-button" type="button" aria-label="Edit playlist title" hidden>
                    <span class="material-symbols-outlined" aria-hidden="true">edit</span>
                </button>
                <button id="heroArtEditButton" class="hero-edit-button" type="button" aria-label="Edit playlist art" hidden aria-expanded="false">
                    <span class="material-symbols-outlined" aria-hidden="true">palette</span>
                </button>
            </div>
            <p class="meta"><span id="heroCompany">Company Name</span> <span id="heroMetaDot" class="dot"></span> <span id="heroYear">Year</span></p>
            <label id="publicToggleLabel" class="public-toggle" hidden>
                <input id="publicToggle" type="checkbox" />
                <span class="public-toggle-switch" aria-hidden="true"></span>
                <span class="public-toggle-text">Public playlist</span>
            </label>
            <div id="heroArtEditPopover" class="hero-art-edit-popover" role="dialog" aria-label="Edit playlist art" hidden>
                <label class="hero-art-edit-field">
                    <span class="hero-art-edit-label">Color</span>
                    <span class="hero-art-edit-color-row">
                        <input id="heroArtEditColor" type="color" />
                        <span id="heroArtEditColorSwatch" class="hero-art-edit-swatch" aria-hidden="true"></span>
                    </span>
                </label>
                <label class="hero-art-edit-field">
                    <span class="hero-art-edit-label">Icon</span>
                    <select id="heroArtEditIcon"></select>
                </label>
                <div class="hero-art-edit-actions">
                    <button id="heroArtEditCancel" class="hero-art-edit-button" type="button">Cancel</button>
                    <button id="heroArtEditSave" class="hero-art-edit-button primary" type="button">Save</button>
                </div>
            </div>
        </div>
    </section>

    <section class="action-bar" aria-label="Album actions">
        <button class="primary-action" type="button"><span class="material-symbols-outlined">play_arrow</span></button>
        <button class="ghost-icon" type="button"><span class="material-symbols-outlined">favorite</span></button>
        <button class="ghost-icon" type="button"><span class="material-symbols-outlined">add_circle</span></button>
        <button class="ghost-icon" type="button"><span class="material-symbols-outlined">more_horiz</span></button>
        <p id="status" class="shell-status">Waiting for library...</p>
    </section>

    <section class="playlist" aria-label="Track list">
        <div class="playlist-header">
            <span>#</span>
            <span>Title</span>
            <span>Type</span>
        </div>
        <ul id="trackList" class="track-list playlist-list"></ul>
    </section>
</main>

<script type="module" src="/playlist.js"></script>
</body>
</html>
