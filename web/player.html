<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trackify Player</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&family=Inter:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/player.css" />

<script>
    // Generated backend wrappers read this prefix in locateFile(path).
    window.WASM_SEARCH_PATH = 'wasm/';
</script>
<script src="/player/worklet_player/feature_flag.js"></script>
<script>
    // Pick the player runtime: AudioWorklet (default) or the legacy
    // ScriptProcessorNode pipeline. `?wp=0` in the URL flips the
    // entire stack back to the legacy pipeline; see
    // docs/audio-worklet-migration.md §9 (WP-E).
    (function () {
        var useWp = (typeof window.wpUseWorkletPlayer === 'function')
            ? window.wpUseWorkletPlayer()
            : true;
        var src = useWp ? '/wasm/wp_player.js' : '/wasm/scriptprocessor_player.js';
        var s = document.createElement('script');
        s.src = src;
        s.async = false;
        document.head.appendChild(s);
        try {
            console.info('[trackify] audio pipeline: ' +
                (useWp ? 'AudioWorklet' : 'legacy ScriptProcessorNode') +
                (useWp && typeof AudioWorkletNode === 'undefined' ? ' (fallback to legacy — worklet unsupported)' : ''));
        } catch (_e) { /* ignore */ }
    })();
</script>
</head>
<body>
<div class="player-root">
    <div class="footer-track">
        <div class="thumb" aria-hidden="true"></div>
        <div class="footer-track-text">
            <p id="currentTrackTitle" class="track-title">No track selected</p>
            <p id="currentTrackMeta" class="track-meta">Unknown game</p>
            <p id="status" class="status">Waiting for playlist...</p>
        </div>
    </div>

    <div class="footer-center">
        <div class="controls" aria-label="Playback controls">
            <button id="shuffleBtn" title="Shuffle" type="button" aria-pressed="false"><span class="material-symbols-outlined">shuffle</span></button>
            <button id="prevBtn" title="Previous" type="button"><span class="material-symbols-outlined filled">skip_previous</span></button>
            <button id="playBtn" title="Play / Pause" type="button"><span class="material-symbols-outlined filled">play_arrow</span></button>
            <button id="nextBtn" title="Next" type="button"><span class="material-symbols-outlined filled">skip_next</span></button>
        </div>

        <div class="seek" id="seekWrap">
            <span id="timeCurrent" class="time">0:00</span>
            <input id="seekBar" type="range" min="0" max="100" value="0" step="100" disabled />
            <span id="timeTotal" class="time">0:00</span>
        </div>
    </div>

    <div class="footer-side">
        <div class="volume-wrap" aria-label="Volume controls">
            <span class="material-symbols-outlined">volume_up</span>
            <input id="volumeBar" class="volume-range" type="range" min="0" max="100" value="80" step="1" aria-label="Volume" />
        </div>
    </div>
</div>

<script type="module" src="/player.js"></script>
</body>
</html>
