<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trackify Games</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&family=Inter:wght@400;500&family=Montserrat:wght@600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/app.css" />
<link rel="stylesheet" href="/games.css" />
</head>

<body class="games-page">
<main class="games-root">
    <section class="games-header" aria-label="Games overview">
        <p class="eyebrow">Browse By Game</p>
        <h2>Games Library</h2>
        <!-- <p class="games-subtitle">Select a game to load its soundtrack playlist.</p> -->
        <p id="gamesStatus" class="shell-status">Waiting for library...</p>
    </section>

    <section aria-label="Games grid">
        <ul id="gamesGrid" class="games-grid"></ul>
    </section>
</main>

<script type="module" src="/games.js"></script>
</body>
</html>
