<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trackify Collections</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&family=Inter:wght@400;500&family=Montserrat:wght@600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/app.css" />
<link rel="stylesheet" href="/collections.css" />
</head>

<body class="collections-page">
<main class="collections-root">
    <section class="collections-header" aria-label="Collections overview">
        <p class="eyebrow">Browse</p>
        <h2>Library</h2>
        <p id="collectionsStatus" class="shell-status">Waiting for library...</p>
    </section>

    <section id="collectionsHero" class="collections-hero" hidden aria-label="Favorites shortcut">
        <a class="hero-card" href="/playlist.html#?favorites">
            <div class="hero-art" aria-hidden="true">
                <div class="hero-art-inner">
                    <span class="material-symbols-outlined">favorite</span>
                </div>
            </div>
            <div class="hero-text">
                <span class="hero-eyebrow">Playlist</span>
                <h3 class="hero-title">Liked Tracks</h3>
            </div>
        </a>
    </section>

    <section id="collectionsGridSection" aria-label="Collections grid">
        <ul id="collectionsGrid" class="collections-grid"></ul>
    </section>
</main>

<script type="module" src="/collections.js"></script>
</body>
</html>
